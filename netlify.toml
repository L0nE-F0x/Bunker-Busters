# Site root = marketing page, /play/ = the browser build of the game.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/play"
  to = "/play/"
  status = 301

[[redirects]]
  from = "/press"
  to = "/press/"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

# Every page and file: safe defaults. Deliberately no Content-Security-Policy (the game needs
# WebAssembly, workers and blob: URLs) and no X-Frame-Options (the game may be embedded on itch.io).
# Permissions-Policy only switches off what nothing here uses; the game's gamepad, fullscreen,
# autoplay and clipboard keep their defaults.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), midi=(), display-capture=(), browsing-topics=()"

# Vite emits content-hashed filenames under /assets — cache them forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Models and voice clips are requested as `x.glb?v=<content hash>` (vite.config.ts), so a changed
# file gets a new URL: browsers can keep them for a year without asking again.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "model/gltf-binary"

[[headers]]
  for = "/voice/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# (no-cache: an installed app and a reinstall must see manifest changes, like the switch to standalone)
[[headers]]
  for = "/play.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# The offline service worker (scripts/offline/sw.js): always check for a new one.
[[headers]]
  for = "/play/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
