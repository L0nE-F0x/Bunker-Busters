<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- phones: "Add to Home Screen" runs the game fullscreen in landscape (play.webmanifest) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bunker Busters" />
    <title>Play Bunker Busters in your browser</title>
    <meta name="description" content="Play Bunker Busters free in your browser: no install. They built bunkers. You brought lockpicks." />
    <link rel="canonical" href="https://bunker-busters.netlify.app/play/" />
    <meta name="theme-color" content="#ff7a1f" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph (Facebook, Discord, Slack, WhatsApp, LinkedIn, iMessage…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bunker Busters" />
    <meta property="og:url" content="https://bunker-busters.netlify.app/play/" />
    <meta property="og:title" content="Play Bunker Busters in your browser" />
    <meta property="og:description" content="Play Bunker Busters free in your browser: no install. They built bunkers. You brought lockpicks." />
    <meta property="og:image" content="https://bunker-busters.netlify.app/og.jpg" />
    <meta property="og:image:secure_url" content="https://bunker-busters.netlify.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Bunker Busters logo beside four people round a campfire under a gas station canopy at dusk" />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Play Bunker Busters in your browser" />
    <meta name="twitter:description" content="Play Bunker Busters free in your browser: no install. They built bunkers. You brought lockpicks." />
    <meta name="twitter:image" content="https://bunker-busters.netlify.app/og.jpg" />
    <meta name="twitter:image:alt" content="The Bunker Busters logo beside four people round a campfire under a gas station canopy at dusk" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/play.webmanifest" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <!-- the loading screen, up before the game's script arrives (ui/loading.ts takes it over) -->
    <div id="loading">
      <div class="logo-sm">BUNKER BUSTERS</div>
      <div class="bar"><i style="width: 2%"></i></div>
      <div class="msg">LOADING THE GAME</div>
      <div class="detail"></div>
      <div class="tip">Tip: SeedBot is running on 12% battery, so it powers down more often than you'd think.</div>
    </div>
    <noscript><p class="boot-note">Bunker Busters needs JavaScript. Turn it on for this site and reload the page.</p></noscript>
    <script nomodule>
      document.getElementById('loading').innerHTML = '<p class="boot-note">This browser is too old to run Bunker Busters. Update it, or try a recent Chrome, Edge, Firefox or Safari.</p>';
    </script>
    <script>
      // the game's script never arriving (offline, blocked, a bad deploy) or failing to parse: say so
      // instead of leaving the bar sitting still. Once main.ts runs it handles its own errors.
      (function () {
        var shown = false;
        function fail(why) {
          if (shown || window.__bbBooted) return;
          shown = true;
          var el = document.getElementById('loading');
          if (!el) return;
          el.innerHTML = '<div class="logo-sm">BUNKER BUSTERS</div><p class="boot-note">' + why +
            '</p><p class="boot-note"><a href="" onclick="location.reload(); return false">Try again</a></p>';
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT') fail("The game's files didn't download. Check your connection and try again.");
          else if (!window.__bbBooted && e.error instanceof SyntaxError) fail('This browser is too old to run Bunker Busters. Update it, or try a recent Chrome, Edge, Firefox or Safari.');
          else if (!window.__bbBooted && e.filename && e.filename.indexOf(location.origin) === 0) fail('Bunker Busters hit an error while starting: ' + String(e.message).replace(/[<>&]/g, '') + '. Updating the browser usually fixes this.');
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
