[package]
name = "bunker-busters"
version = "0.5.1"
description = "Bunker Busters — desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
x11-dl = "2.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
